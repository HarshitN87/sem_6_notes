<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Academic Portal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    :root{
      --bg:#f5efe7;
      --card:rgba(255,255,255,0.35);
      --border:#d7c2b0;
      --text:#2a1f17;
      --muted:#8f7563;
      --accent:#a86441;
      --shadow:rgba(62,40,22,0.08);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      background:var(--bg);
      font-family:'Inter', sans-serif;
      color:var(--text);
      overflow-x:hidden;
      position:relative;
    }

    /* Decorative strip */
    .top-strip{
      width:100%;
      height:10px;
      background:
      repeating-linear-gradient(
        90deg,
        #6d4c2f 0 14px,
        #b67d39 14px 28px,
        #6e7d3d 28px 42px,
        #c09b3c 42px 56px,
        #465728 56px 70px
      );
    }

    /* Ambient background shapes */
    .blur{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:0.22;
      z-index:0;
    }

    .blur-one{
      width:320px;
      height:320px;
      background:#d9b89e;
      top:10%;
      left:-100px;
    }

    .blur-two{
      width:260px;
      height:260px;
      background:#e7cdb8;
      bottom:10%;
      right:-70px;
    }

    .container{
      position:relative;
      z-index:2;
      min-height:calc(100vh - 10px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:60px 24px;
    }

    .tag{
      border:1px solid var(--border);
      padding:12px 28px;
      letter-spacing:6px;
      font-size:0.78rem;
      color:var(--muted);
      background:rgba(255,255,255,0.25);
      backdrop-filter:blur(10px);
      margin-bottom:42px;
    }

    h1{
      font-family:'Cormorant Garamond', serif;
      font-size:7rem;
      font-weight:500;
      line-height:0.9;
      margin-bottom:28px;
      color:#2b1f16;
    }

    .subtitle{
      font-family:'Cormorant Garamond', serif;
      font-style:italic;
      font-size:2.2rem;
      color:var(--accent);
      text-align:center;
      line-height:1.5;
      max-width:850px;
      margin-bottom:70px;
    }

    .subjects-grid{
      width:100%;
      max-width:1200px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:28px;
    }

    .subject-card{
      text-decoration:none;
      color:inherit;
      padding:34px 28px;
      border-radius:30px;
      background:var(--card);
      border:1px solid rgba(215,194,176,0.9);
      backdrop-filter:blur(14px);
      box-shadow:0 12px 35px var(--shadow);
      transition:all 0.35s ease;
      position:relative;
      overflow:hidden;
    }

    .subject-card::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        135deg,
        rgba(255,255,255,0.45),
        rgba(255,255,255,0.05)
      );
      opacity:0;
      transition:0.35s ease;
    }

    .subject-card:hover{
      transform:translateY(-8px);
      border-color:#b88b6d;
      box-shadow:0 20px 45px rgba(60,40,20,0.12);
    }

    .subject-card:hover::before{
      opacity:1;
    }

    .subject-name{
      font-family:'Cormorant Garamond', serif;
      font-size:2.5rem;
      line-height:1.1;
      margin-bottom:14px;
      position:relative;
      z-index:2;
    }

    .subject-desc{
      font-size:0.9rem;
      letter-spacing:2px;
      text-transform:uppercase;
      color:var(--muted);
      position:relative;
      z-index:2;
    }

    .footer{
      margin-top:70px;
      font-size:0.82rem;
      letter-spacing:2px;
      color:#9d8775;
    }

    @media(max-width:768px){

      h1{
        font-size:4.5rem;
        text-align:center;
      }

      .subtitle{
        font-size:1.6rem;
      }

      .tag{
        letter-spacing:4px;
        text-align:center;
      }

    }

  </style>
</head>
<body>

  <div class="top-strip"></div>

  <div class="blur blur-one"></div>
  <div class="blur blur-two"></div>

  <main class="container">

    <div class="tag">
      Notes by harshit
    </div>

    <h1>Subjects</h1>


    <section class="subjects-grid">

      <a href="./computer_networks/index.html" class="subject-card">
        <div class="subject-name">Computer Networks</div>
      </a>

      <a href="./compiler_design/index.html" class="subject-card">
        <div class="subject-name">Compiler Design</div>
      </a>


    </section>


  </main>

</body>
</html>
